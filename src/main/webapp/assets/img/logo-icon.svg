<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#667eea" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#mainGrad)" opacity="0.1"/>

  <!-- Stylized E logo -->
  <g transform="translate(50, 50)" filter="url(#shadow)">
    <!-- Main E shape -->
    <path d="M -25 -30
             L -25 -30
             L 15 -30
             L 15 -18
             L -10 -18
             L -10 -5
             L 12 -5
             L 12 8
             L -10 8
             L -10 18
             L 18 18
             L 18 30
             L -25 30
             Z"
          fill="url(#mainGrad)"/>

    <!-- Gold accent checkmark -->
    <path d="M 5 22
             L 12 30
             L 28 10"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)"/>
  </g>

  <!-- Small dots decoration -->
  <circle cx="20" cy="80" r="3" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="75" cy="20" r="3" fill="url(#goldGrad)" opacity="0.6"/>
</svg>