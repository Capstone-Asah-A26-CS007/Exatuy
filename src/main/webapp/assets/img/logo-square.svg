<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#667eea" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="45" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="35" cy="45" r="20" fill="white" opacity="0.05"/>
  <circle cx="165" cy="160" r="30" fill="white" opacity="0.05"/>

  <!-- Main E + Checkmark -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- E shape -->
    <path d="M -50 -60
             L -50 -60
             L 30 -60
             L 30 -35
             L -20 -35
             L -20 -10
             L 25 -10
             L 25 15
             L -20 15
             L -20 35
             L 35 35
             L 35 60
             L -50 60
             Z"
          fill="white"
          opacity="0.95"/>

    <!-- Gold checkmark -->
    <path d="M 10 40
             L 30 65
             L 80 0"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="40" cy="100" r="5" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="160" cy="90" r="4" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="100" cy="170" r="4" fill="white" opacity="0.3"/>
</svg>