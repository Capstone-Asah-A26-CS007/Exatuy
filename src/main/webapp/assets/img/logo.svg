<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Definitions -->
  <defs>
    <!-- Main gradient for the shield -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>

    <!-- Gold gradient for accent -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#667eea" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Shield Background -->
    <path d="M 40 5
             L 40 5
             Q 40 5 40 5
             L 70 15
             Q 75 17 75 22
             L 75 55
             Q 75 70 40 85
             Q 5 70 5 55
             L 5 22
             Q 5 17 10 15
             Z"
          fill="url(#shieldGradient)"
          filter="url(#shadow)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>

    <!-- Checkmark -->
    <path d="M 25 42
             L 35 52
             L 55 32"
          fill="none"
          stroke="url(#goldGradient)"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)"/>

    <!-- Document Icon overlay -->
    <rect x="48" y="45" width="20" height="24" rx="3"
          fill="rgba(255,255,255,0.9)"
          transform="rotate(10, 58, 57)"/>
    <line x1="52" y1="52" x2="64" y2="52" stroke="#667eea" stroke-width="2" transform="rotate(10, 58, 57)"/>
    <line x1="52" y1="58" x2="64" y2="58" stroke="#667eea" stroke-width="2" transform="rotate(10, 58, 57)"/>
  </g>

  <!-- Brand Name Text -->
  <g transform="translate(100, 0)">
    <!-- Main "Exatuy" Text -->
    <text x="0" y="65"
          font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="48"
          font-weight="700"
          fill="#1f2937">
      Exatuy
    </text>

    <!-- Accent dot on the 'i' (styled as a golden dot) -->
    <circle cx="205" cy="32" r="5" fill="url(#goldGradient)"/>

    <!-- Tagline -->
    <text x="5" y="88"
          font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="14"
          font-weight="500"
          fill="#6b7280"
          letter-spacing="2">
      SECURE ASSESSMENT PLATFORM
    </text>
  </g>
</svg>