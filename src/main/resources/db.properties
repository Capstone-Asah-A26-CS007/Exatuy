# ============================================
# Database Configuration for Examora
# ============================================
# IMPORTANT: Change these values before deployment!
# Do NOT use default/root credentials in production!

# Database Connection
db.url=jdbc:mysql://localhost:3306/examora_db?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
db.username=examora_app
db.password=CHANGE_ME

# Connection Pool Settings (HikariCP)
# These are managed by DBUtil.java, listed here for reference only
# db.maxTotal=100
# db.maxIdle=30
# db.maxWaitMillis=10000

# ============================================
# Email Configuration (Optional)
# ============================================
# Configure these for email notifications functionality
# For Gmail, you need to use an App Password: https://myaccount.google.com/apppasswords

email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.auth=true
email.smtp.starttls=true
email.username=your-email@gmail.com
email.password=your-app-password
email.from=noreply@examora.com

# ============================================
# Setup Instructions
# ============================================
# 1. Create a dedicated MySQL user:
#    CREATE USER 'examora_user'@'localhost' IDENTIFIED BY 'CHANGE_ME_SECURE_PASSWORD';
#    GRANT ALL PRIVILEGES ON examora_db.* TO 'examora_user'@'localhost';
#    FLUSH PRIVILEGES;
#
# 2. Or use environment variables (recommended for Docker/Production):
#    export DB_URL="jdbc:mysql://mysql:3306/examora_db?useSSL=false&serverTimezone=UTC"
#    export DB_USERNAME="examora_user"
#    export DB_PASSWORD="your_secure_password"
